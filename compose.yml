services:
  # Local dev + test database. Always starts with `docker compose up`.
  postgres:
    image: postgres:16
    container_name: volt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Prod-parity run: builds the exact image Railway deploys and boots it
  # (migrate deploy + npm start) against local Postgres. Behind the `parity`
  # profile so it does NOT run during normal dev work. Run the
  # backend natively with `npm run dev`. Start parity explicitly with:
  #   docker compose --profile parity up backend
  backend:
    profiles: ["parity"]
    build:
      context: ./backend-volt # uses ./backend-volt/Dockerfile (the prod image)
    container_name: volt-backend
    restart: unless-stopped
    env_file:
      - ./backend-volt/.env # CLERK_SECRET_KEY etc.
    environment:
      NODE_ENV: production
      # db.ts requires DATABASE_URL when NODE_ENV=production. Point it at the
      # compose Postgres — `postgres` resolves on the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SERVER_PORT: 8080
      ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
