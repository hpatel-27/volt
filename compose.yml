services:
  postgres:
    image: postgres:16
    container_name: volt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-volt
    container_name: volt-backend
    restart: unless-stopped
    env_file:
      - ./backend-volt/.env
    environment:
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend-volt:/app
      - /app/node_modules
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend-volt
    container_name: volt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend-volt:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  pgdata:
